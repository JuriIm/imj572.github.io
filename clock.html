<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knitting Clock</title>

  <style>
    body {
      margin: 0;
    }

    .clock {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #101428;
    }

    .knitting {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55vmin;
      height: 60vmin;
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      grid-template-rows: repeat(24, minmax(0, 1fr));
      direction: rtl;
    }

    .stitch {
      display: block;
      width: 100%;
      height: auto;
      align-self: start;
    }
  </style>
</head>

<body>
  <main class="clock" aria-label="Knitting clock">
    <img src="./images/stitch.png" alt="V자 이미지 로딩 실패"
     style="position: absolute; top: 20px; left: 20px; width: 100px; color: white; z-index: 1;">
    <div class="knitting"></div>
  </main>

  <script>
    const clock = document.querySelector(".clock");
    const knitting = document.querySelector(".knitting");
    const imagePath = "images/stitch.png";

    const stitches = [];
    const stitchesPerRow = 10;
    const totalStitches = 24 * stitchesPerRow;
    const minutesPerStitch = 60 / stitchesPerRow;

    const testMode = true;
    const previewDuration = 60000;
    const previewStart = performance.now();

    // Repeat the same Figma image to make 24 rows of 10 stitches.
    for (let i = 0; i < totalStitches; i++) {
      const stitch = document.createElement("img");
      stitch.src = imagePath;
      stitch.alt = "";
      stitch.className = "stitch";
      knitting.appendChild(stitch);
      stitches.push(stitch);
    }

    // Each entry gives the hour, top color, and bottom color.
    const skyStops = [
      [0,    "#101428", "#101428"],
      [4.5,  "#101428", "#101428"],
      [6,    "#344b86", "#a7b3d9"],
      [9,    "#65bce8", "#e0f5ff"],
      [15,   "#65bce8", "#e0f5ff"],
      [17.5, "#f36a3d", "#ffca72"],
      [18.5, "#9b2545", "#ff5238"],
      [20,   "#292041", "#683458"],
      [21.5, "#101428", "#101428"],
      [24,   "#101428", "#101428"]
    ];

    function mixSkyColor(from, to, amount) {
      const channels = [1, 3, 5].map(function (index) {
        const start = parseInt(from.slice(index, index + 2), 16);
        const end = parseInt(to.slice(index, index + 2), 16);
        return Math.round(start + (end - start) * amount);
      });

      return `rgb(${channels.join(", ")})`;
    }

    function updateSky(hour) {
      for (let i = 1; i < skyStops.length; i++) {
        const [endHour, endTop, endBottom] = skyStops[i];

        if (hour <= endHour) {
          const [startHour, startTop, startBottom] = skyStops[i - 1];
          const amount = (hour - startHour) / (endHour - startHour);
          const top = mixSkyColor(startTop, endTop, amount);
          const bottom = mixSkyColor(startBottom, endBottom, amount);

          clock.style.background = `linear-gradient(${top}, ${bottom})`;
          return;
        }
      }
    }

    function updateClock() {
      // Option 4: Read the computer's current hours, minutes, and seconds.
      const date = new Date();
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const seconds = date.getSeconds();
      let minutesToday = hours * 60 + minutes + seconds / 60;

      // In test mode, show a full day in 60 seconds.
      if (testMode) {
        const elapsed = (performance.now() - previewStart) % previewDuration;
        minutesToday = elapsed / previewDuration * 1440;
      }

      updateSky(minutesToday / 60);

      // Hide one full V-shaped stitch for every six clock minutes.
      const unraveled = Math.floor(minutesToday / minutesPerStitch);

      for (let i = 0; i < totalStitches; i++) {
        stitches[i].style.visibility = i < unraveled ? "hidden" : "visible";
      }
    }

    updateClock();
    setInterval(updateClock, testMode ? 30 : 1000);
  </script>
</body>
</html>
