<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knitting Clock</title>

  <style>
    body {
      margin: 0;
    }

    .clock {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #101428;
    }

    .clock [hidden] {
      display: none !important;
    }

    .stars,
    .thread-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .stars {
      opacity: 0;
    }

    .stars img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .window-light {
      position: absolute;
      top: -8vmin;
      right: 5%;
      width: min(30vw, 34vmin);
      height: 43vmin;
      pointer-events: none;
      opacity: 0;
      filter: blur(0.8vmin);
      transform: translateX(var(--light-shift, 0%)) rotate(24deg);
      transform-origin: center top;
    }

    .window-light::before,
    .window-light::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 38%;
      background: linear-gradient(
        to bottom,
        #fff4cf,
        #fff4cf99 46%,
        #fff4cf00 100%
      );
    }

    .window-light::before {
      left: 6%;
    }

    .window-light::after {
      right: 6%;
    }

    .knitting {
      position: absolute;
      top: 13%;
      left: calc(50% - 36vmin);
      width: 55vmin;
      height: 60%;
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      grid-template-rows: repeat(24, minmax(0, 1fr));
      direction: rtl;
    }

    .stitch {
      width: 100%;
      height: auto;
      align-self: start;
      opacity: var(--stitch-opacity, 1);
      transition: filter 150ms ease, opacity 150ms ease;
    }

    .stitch.unraveled {
      filter: brightness(0) invert(1) sepia(0.2);
      opacity: 0.17;
    }

    .thread-line {
      fill: none;
      stroke: #b4140d;
      stroke-width: clamp(2px, 0.45vmin, 5px);
      stroke-linecap: round;
    }

    .yarn-ball {
      position: absolute;
      left: calc(50% + 24vmin);
      bottom: 0;
      width: 76vmin;
      height: auto;
      display: block;
      transform: translateX(-50%) scale(0);
      transform-origin: center bottom;
    }

    .complete-yarn {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54vmin;
      max-height: 62vmin;
      object-fit: contain;
      transform: translate(-50%, -50%);
    }

    .sound-toggle {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 2;
      padding: 8px 12px;
      border: 1px solid #ffffff66;
      border-radius: 20px;
      background: #101428cc;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="clock" aria-label="Knitting clock">
    <div class="stars" aria-hidden="true">
      <img src="./images/star.png" alt="">
    </div>

    <div class="window-light" aria-hidden="true"></div>
    <div class="knitting"></div>

    <svg class="thread-layer" aria-hidden="true">
      <path class="thread-line"></path>
    </svg>

    <img class="yarn-ball" src="./images/Circle%20Thread.png" alt="">
    <img class="complete-yarn" src="./images/Complete%20Thread.png" alt="" hidden>

    <button class="sound-toggle" type="button" aria-pressed="false">
      Sound off
    </button>
    <audio id="rustle" src="./images/rustle.wav" preload="auto"></audio>
  </main>

  <script>
    const clock = document.querySelector(".clock");
    const stars = document.querySelector(".stars");
    const windowLight = document.querySelector(".window-light");
    const knitting = document.querySelector(".knitting");
    const threadLayer = document.querySelector(".thread-layer");
    const threadLine = document.querySelector(".thread-line");
    const yarnBall = document.querySelector(".yarn-ball");
    const completeYarn = document.querySelector(".complete-yarn");
    const soundToggle = document.querySelector(".sound-toggle");
    const rustle = document.querySelector("#rustle");

    const stitches = [];
    const stitchesPerRow = 10;
    const totalStitches = 24 * stitchesPerRow;

    const testMode = true;
    const previewDay = 60000;
    const previewEnding = 800;
    const previewStart = performance.now();

    let soundEnabled = false;
    let previousRow = null;
    rustle.volume = 1;

    async function playRustle() {
      try {
        rustle.currentTime = 0;
        await rustle.play();
      } catch (error) {
        if (soundEnabled) {
          soundEnabled = false;
          soundToggle.setAttribute("aria-pressed", "false");
          soundToggle.textContent = "Audio unavailable";
          console.warn("Could not play ./images/rustle.wav", error);
        }
      }
    }

    soundToggle.addEventListener("click", function () {
      soundEnabled = !soundEnabled;
      soundToggle.setAttribute("aria-pressed", String(soundEnabled));
      soundToggle.textContent = soundEnabled ? "Sound on" : "Sound off";

      if (soundEnabled) {
        playRustle();
      } else {
        rustle.pause();
      }
    });

    for (let i = 0; i < totalStitches; i++) {
      const stitch = document.createElement("img");
      stitch.src = "./images/stitch.png";
      stitch.alt = "";
      stitch.className = "stitch";
      knitting.appendChild(stitch);
      stitches.push(stitch);
    }

    const skyStops = [
      [0,    "#101428", "#101428"],
      [4.5,  "#101428", "#101428"],
      [6,    "#3f3d73", "#c39dc7"],
      [7.5,  "#8099cf", "#e2d2eb"],
      [9,    "#dff4ff", "#53bee9"],
      [15,   "#dff4ff", "#53bee9"],
      [16.5, "#a5aadf", "#efaacb"],
      [18,   "#ff5337", "#ffb36b"],
      [19,   "#9b2545", "#ff5238"],
      [20,   "#292041", "#683458"],
      [21.5, "#101428", "#101428"],
      [24,   "#101428", "#101428"]
    ];

    function mixSkyColor(from, to, amount) {
      const channels = [1, 3, 5].map(function (index) {
        const start = parseInt(from.slice(index, index + 2), 16);
        const end = parseInt(to.slice(index, index + 2), 16);
        return Math.round(start + (end - start) * amount);
      });

      return `rgb(${channels.join(", ")})`;
    }

    function updateSky(hour) {
      for (let i = 1; i < skyStops.length; i++) {
        const [endHour, endTop, endBottom] = skyStops[i];

        if (hour <= endHour) {
          const [startHour, startTop, startBottom] = skyStops[i - 1];
          const amount = (hour - startHour) / (endHour - startHour);
          const top = mixSkyColor(startTop, endTop, amount);
          const bottom = mixSkyColor(startBottom, endBottom, amount);

          clock.style.background = `linear-gradient(${top}, ${bottom})`;
          return;
        }
      }
    }

    function updateWindowLight(hour) {
      const morning = (hour - 6) / 3;
      const evening = (18 - hour) / 3;
      const daylight = Math.max(0, Math.min(1, morning, evening));
      const travel = Math.max(0, Math.min(1, (hour - 6) / 12));

      windowLight.style.opacity = daylight * 0.36;
      windowLight.style.setProperty("--light-shift", `${travel * 18}%`);
    }

    function connectThread(stitch) {
      const scene = clock.getBoundingClientRect();
      const stitchBox = stitch.getBoundingClientRect();
      const ballBox = yarnBall.getBoundingClientRect();

      // Attach the thread to the current stitch and the moved yarn ball.
      const startX = stitchBox.left - scene.left + stitchBox.width * 0.92;
      const startY = stitchBox.top - scene.top + stitchBox.height * 0.18;
      const endX = ballBox.left - scene.left + ballBox.width * 0.50;
      const endY = ballBox.top - scene.top + ballBox.height * 0.55;

      const distanceX = endX - startX;
      const distanceY = endY - startY;
      const curve = Math.min(scene.width, scene.height) * 0.08;

      threadLine.setAttribute(
        "d",
        `M ${startX} ${startY}
         C ${startX + distanceX * 0.35 + curve} ${startY + distanceY * 0.12},
           ${endX + curve} ${endY - distanceY * 0.26},
           ${endX} ${endY}`
      );
    }

    function updateClock() {
      const date = new Date();
      const secondsToday =
        date.getHours() * 3600 +
        date.getMinutes() * 60 +
        date.getSeconds();

      let skyHour = secondsToday / 3600;
      let progress = Math.min(secondsToday / 86395, 1);

      if (testMode) {
        const elapsed = (performance.now() - previewStart) %
          (previewDay + previewEnding);
        progress = Math.min(elapsed / previewDay, 1);
        skyHour = progress * 24;
      }

      updateSky(skyHour);
      updateWindowLight(skyHour);

      const dawnStars = (7 - skyHour) / 2.5;
      const eveningStars = (skyHour - 19) / 2.5;
      stars.style.opacity = Math.max(
        0,
        Math.min(1, Math.max(dawnStars, eveningStars))
      );

      const finished = progress === 1;
      const exactStitches = progress * totalStitches;
      const unraveled = Math.floor(exactStitches);
      const completedRows = Math.floor(unraveled / stitchesPerRow);

      if (soundEnabled && previousRow !== null && completedRows > previousRow) {
        playRustle();
      }
      previousRow = completedRows;

      for (let i = 0; i < totalStitches; i++) {
        stitches[i].classList.toggle("unraveled", i < unraveled);
      }

      const finalOpacity = Math.min(1, totalStitches - exactStitches);
      stitches[totalStitches - 1].style.setProperty("--stitch-opacity", finalOpacity);
      threadLayer.style.opacity = finalOpacity;

      knitting.hidden = finished;
      threadLayer.hidden = finished;
      yarnBall.hidden = finished;
      completeYarn.hidden = !finished;

      if (finished) {
        return;
      }

      const ballScale = progress ** 0.72;
      yarnBall.style.transform = `translateX(-50%) scale(${ballScale})`;
      connectThread(stitches[unraveled]);
    }

    updateClock();
    setInterval(updateClock, testMode ? 30 : 1000);
    window.addEventListener("resize", updateClock);
  </script>
</body>
</html>
