<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hide and Reveal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div
    id="start-screen"
    onclick="document.body.classList.add('started')"
  ></div>

  <main>
    <div class="image-stage">
      <img
        class="background-image"
        src="visual only images/visual imgBW.jpg"
        alt="New York skyline"
      >

      <img
        class="plane"
        src="visual only images/planes.png"
        alt=""
      >

      <div class="black-box box-1"></div>
      <div class="black-box box-2"></div>
      <div class="black-box box-3"></div>
      <div class="black-box box-4"></div>
      <div class="black-box box-5"></div>
      <div class="black-box box-6"></div>
      <div class="black-box box-7"></div>
      <div class="black-box box-8"></div>
      <div class="black-box box-9"></div>
      <div class="black-box box-10"></div>
      <div class="black-box box-11"></div>
      <div class="black-box box-12"></div>
      <div class="black-box box-13"></div>
      <div class="black-box box-14"></div>
      <div class="black-box box-15"></div>
      <div class="black-box box-16"></div>
      <div class="black-box box-17"></div>
      <div class="black-box box-18"></div>
      <div class="black-box box-19"></div>
      <div class="black-box box-20"></div>
    </div>
  </main>
</body>
</html>
